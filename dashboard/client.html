<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuzz home safety</title>
<link rel="stylesheet" href="/s/style.css">
<style>
  body { padding: 0 16px 40px; }
  .wrap { max-width: 460px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 4px 14px; }
  .stack > * + * { margin-top: 16px; }
  .hero { text-align: center; padding: 28px 20px 24px; }
  .hero .ring { width: 190px; height: 190px; margin: 0 auto 18px; }
  .hero .msg { margin: 10px auto 0; text-align: left; }
  .hero h1 { font-size: 32px; }
  .hero .sub { margin-top: 6px; color: var(--muted); font-size: 15px; }
  .hero .found { margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: var(--card); text-align: left; font-size: 15px; }
  .steps { margin: 0; padding-left: 20px; }
  .steps li + li { margin-top: 8px; }
  .big { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin-top: 6px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .row:first-of-type { border-top: 0; }
  .row b { text-align: right; }
  button.alerts { width: 100%; }
  #offline { display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 16px; background: var(--trip-soft); color: var(--trip); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo" id="logo"></span><span class="pill" id="where">connecting...</span></header>
  <div id="offline">Cannot reach your Fuzz unit right now.</div>
  <div class="stack" id="app">
    <section class="card hero NORMAL" id="hero">
      <div id="ring"></div>
      <h1 id="word">Waiting for your unit</h1>
      <p class="sub" id="sub"></p>
      <div class="found" id="found" hidden></div>
    </section>
    <section class="card" id="whatnow" hidden><h3>What to do</h3><ol class="steps" id="steps"></ol></section>
    <section class="card" id="whereCard" hidden><h3>Where is the problem?</h3><div id="wire"></div><div class="big" id="distText"></div><p class="small muted" id="distNote" style="margin-top:4px"></p></section>
    <section class="card" id="loadCard" hidden><h3>What is probably plugged in</h3><div class="chips" id="chips"></div></section>
    <section class="card"><h3>Your circuit</h3><div id="facts"></div></section>
    <button class="ghost alerts" id="alerts">Turn on alerts on this device</button>
    <p class="small muted" style="text-align:center">Fuzz is an educational prototype, not a certified safety device. Appliance and distance guesses are estimates.</p>
  </div>
</div>
<script src="/s/common.js"></script>
<script>
document.getElementById("logo").innerHTML = LOGO;
mountRing(document.getElementById("ring"));
const STEPS = {
  WARNING: ["If it is safe to do so, switch off and unplug appliances on this circuit, heaters first.", "Do not ignore this warning. Fuzz has seen more than one sign of a fault.", "Ask a licensed electrician to inspect the wiring and sockets."],
  TRIP: ["Power to this circuit was cut automatically.", "Keep it off until a licensed electrician has checked the wiring.", "Do not keep resetting it."],
};
const unitParam = new URLSearchParams(location.search).get("unit");
let lastState = null;

function notify(r) {
  document.title = (r.state === "NORMAL" ? "" : STATES[r.state].pill + ": ") + "Fuzz home safety";
  if (lastState !== null && lastState !== r.state && r.state !== "NORMAL") {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    try { if (Notification.permission === "granted") new Notification("Fuzz: " + STATES[r.state].pill, { body: cleanMessage(r.message) }); } catch (e) {}
  }
  lastState = r.state;
}
function row(box, k, v) { const d = el("div", "row"); d.append(el("span", "muted", k), el("b", "", v)); box.append(d); }

async function tick() {
  try {
    const units = await getJSON("/api/units");
    document.getElementById("offline").style.display = "none";
    units.sort((a, b) => a.unit_id.localeCompare(b.unit_id));
    const r = units.find(u => u.unit_id === unitParam) || units[0];
    const facts = document.getElementById("facts"); facts.replaceChildren();
    if (!r) {
      document.getElementById("where").textContent = "waiting for a unit";
      setRing(document.getElementById("ring"), 3, "NORMAL");
      document.getElementById("sub").textContent = "Nothing has reported yet."; return;
    }
    const S = STATES[r.state], ai = r.ai || {}, off = r.relay === "OPEN";
    document.getElementById("where").textContent = r.unit_id;
    document.getElementById("hero").className = "card hero " + r.state;
    const h = Math.max(r.rf / 0.8, r.leak_ma / 30, r.didt, (r.temp_c - 40) / 40, 0) * 100;
    setRing(document.getElementById("ring"), r.state === "TRIP" ? 100 : h, r.state);
    document.getElementById("word").textContent = S.word;
    document.getElementById("sub").textContent = S.sub;
    const f = document.getElementById("found");
    f.hidden = r.state === "NORMAL"; f.textContent = cleanMessage(r.message);
    const steps = STEPS[r.state];
    document.getElementById("whatnow").hidden = !steps;
    const ol = document.getElementById("steps"); ol.replaceChildren();
    (steps || []).forEach(t => ol.append(el("li", "", t)));
    const d = ai.distance;
    document.getElementById("whereCard").hidden = !d;
    if (d) {
      document.getElementById("wire").innerHTML = wireHTML(d, null);
      document.getElementById("distText").textContent = d.hi - d.lo > 12 ? d.zone.charAt(0).toUpperCase() + d.zone.slice(1) : `About ${d.m.toFixed(0)} m from the board`;
      document.getElementById("distNote").textContent = `Best guess ${d.m.toFixed(0)} m, between ${d.lo.toFixed(0)} and ${d.hi.toFixed(0)} m.`;
    }
    document.getElementById("loadCard").hidden = !ai.appliances;
    if (ai.appliances) chips(document.getElementById("chips"), ai);
    row(facts, "Power", off ? "Off" : "On");
    row(facts, "Mains voltage", off ? "-" : r.volt.toFixed(0) + " V");
    row(facts, "Temperature", r.temp_c.toFixed(1) + " °C");
    row(facts, "Updated", clock(r.time));
    notify(r);
  } catch (e) { document.getElementById("offline").style.display = "block"; }
}
document.getElementById("alerts").onclick = async () => {
  try { await Notification.requestPermission(); } catch (e) {}
  document.getElementById("alerts").textContent = (window.Notification && Notification.permission === "granted") ? "Alerts are on" : "Alerts are blocked in this browser";
};
tick(); setInterval(tick, 800);
</script>
</body>
</html>
