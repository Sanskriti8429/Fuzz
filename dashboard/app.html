<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3f6ee">
<title>Fuzz</title>
<link rel="stylesheet" href="/s/style.css">
</head>
<body>
<div id="offline">Cannot reach your Fuzz unit right now.</div>
<div class="app">
  <header class="top">
    <div class="hello"><span id="greet">Hello</span><b id="homeName">Your home</b></div>
    <div class="top-actions" id="actions"></div>
  </header>
  <div class="banner" id="banner"><span id="bannerText">Replaying</span><button id="backLive">Back to live</button></div>
  <main class="pager" id="pager">
    <section class="page" id="p-home" aria-label="Home">
      <div class="stage"><div class="orb-wrap" id="orb"></div></div>
      <div class="headline"><h1 id="word">All good</h1><p id="sub">Your circuit is calm.</p><button class="cta" id="todo" hidden>What to do now</button></div>
      <div class="knowing" id="knowing"></div>
    </section>
    <section class="page" id="p-sensors" aria-label="Sensors">
      <h2 class="page-title">Sensors</h2>
      <div class="tiles" id="tiles"></div>
    </section>
    <section class="page" id="p-history" aria-label="History">
      <h2 class="page-title">History</h2>
      <div class="stack">
        <div class="card">
          <div class="travel"><div class="orb-wrap mini" id="miniorb"></div><div><div class="muted small" id="trLabel">Live</div><div class="big" id="trTime">-</div></div></div>
          <div class="strip" id="strip"><svg viewBox="0 0 300 110" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a99cf0" stop-opacity=".55"/><stop offset="1" stop-color="#a99cf0" stop-opacity="0"/></linearGradient></defs><path id="area" fill="url(#gA)"/><path id="line" fill="none" stroke="#7b6be0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><line id="limit" x1="0" x2="300" stroke="#f2698a" stroke-dasharray="4 4" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="head" id="head"></div></div>
          <p class="hint" id="hint">Drag across the timeline to see how your home looked a moment ago.</p>
        </div>
        <div class="card"><h3>Events</h3><ul class="events" id="events"></ul></div>
      </div>
    </section>
  </main>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<script src="/s/common.js"></script>
<script src="/s/app.js"></script>
</body>
</html>
